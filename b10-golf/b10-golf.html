<title>B10 Golf</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: Scorecard-Raster – schmale Spalte, Kopfleiste oben, Tab-Leiste unten, Karten nur für Scorekarten */
:root{
  --bg:#F3F5EF; --surface:#FFFFFF; --sunk:#E9EDE4; --ink:#14231A; --muted:#5D6A61; --line:#D6DDD2;
  --green:#1E6A44; --green-ink:#FFFFFF; --flag:#C23B2A; --sand:#C9A24A; --warn:#9A6A00;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1611; --surface:#152019; --sunk:#1C2A21; --ink:#E6EEE8; --muted:#94A49A; --line:#2A3A30;
  --green:#4DAE7C; --green-ink:#08130C; --flag:#F0705D; --sand:#D9B866; --warn:#E0B44A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1611; --surface:#152019; --sunk:#1C2A21; --ink:#E6EEE8; --muted:#94A49A; --line:#2A3A30;
  --green:#4DAE7C; --green-ink:#08130C; --flag:#F0705D; --sand:#D9B866; --warn:#E0B44A; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--green)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--green);color:var(--green-ink)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.02em;line-height:1}
.brand small{font-weight:500;font-size:15px;opacity:.8;margin-left:6px;letter-spacing:.06em;text-transform:uppercase}
.status{margin-left:auto;font-size:12px;opacity:.9;text-align:right}
main{padding-block:16px 110px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{background:none;border:0;color:var(--muted);font:600 13px var(--body);padding:12px 4px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
nav.tabs button[aria-current="true"]{color:var(--green);box-shadow:inset 0 3px 0 var(--green)}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:30px} h2{font-size:22px} h3{font-size:18px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.section{display:flex;flex-direction:column;gap:12px;padding-block:8px 20px}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--body);padding:9px 14px;border-radius:8px;cursor:pointer;min-height:40px}
.btn:hover{border-color:var(--green)}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--green);padding-inline:8px}
.btn.danger{color:var(--flag);border-color:color-mix(in srgb,var(--flag) 40%,var(--line))}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--sand);outline-offset:2px}
.seg{display:inline-flex;background:var(--sunk);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);font:600 13px var(--body);padding:7px 12px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.12)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 13px var(--body);padding:6px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.item{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;color:inherit;font:inherit;text-align:left;cursor:pointer;width:100%}
.item:hover{background:var(--sunk)}
.item .grow{flex:1;min-width:0}
.item .title{font-weight:600}
.badge{font:600 11px var(--body);letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:5px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.badge.live{background:color-mix(in srgb,var(--flag) 16%,transparent);color:var(--flag)}
.badge.done{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.note{background:color-mix(in srgb,var(--sand) 18%,var(--surface));border:1px solid color-mix(in srgb,var(--sand) 45%,var(--line));border-radius:8px;padding:10px 12px;font-size:13px}
.num{font-variant-numeric:tabular-nums}
.under{color:var(--flag)}
/* Leaderboard */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.lb{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
table.lb th{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:right;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.lb th:nth-child(2),table.lb td:nth-child(2){text-align:left;white-space:normal;min-width:120px}
table.lb td{padding:10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.lb tr:last-child td{border-bottom:0}
table.lb tbody tr{cursor:pointer}
table.lb tbody tr:hover{background:var(--sunk)}
td.pos{font-family:var(--display);font-weight:700;font-size:18px;text-align:center!important;width:44px;color:var(--muted)}
tr.lead td.pos{color:var(--green)}
td.score{font-family:var(--display);font-weight:700;font-size:22px}
td.pl .nm{font-weight:600} td.pl .sub{font-size:12px;color:var(--muted)}
td.drop{text-decoration:line-through;color:var(--muted)}
/* Scorecard entry */
.cardhead{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.kv .k{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kv .v{font-family:var(--display);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.holes{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.hole{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
.hole:last-child{border-bottom:0}
.hole.turn{border-bottom:2px solid var(--ink)}
.hno{font-family:var(--display);font-weight:700;font-size:24px;text-align:center;line-height:1}
.hmeta{font-size:12px;color:var(--muted);min-width:0}
.hmeta b{color:var(--ink);font-weight:600}
.hmeta .hnote{color:var(--warn);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{color:var(--green);letter-spacing:1px;font-weight:700}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--sunk);color:var(--ink);font:600 20px var(--body);cursor:pointer;line-height:1}
.stepper button:disabled{opacity:.4}
.stepper .sv{width:48px;height:44px;border-radius:8px;background:none;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:24px;cursor:pointer;background:none;border:0;color:var(--ink);font-variant-numeric:tabular-nums;position:relative}
.stepper .sv.empty{color:var(--muted);background:var(--sunk)}
/* scorecard notation: circle under par, square over par */
.mk{display:inline-grid;place-items:center;min-width:30px;height:30px;line-height:1;position:relative}
.mk.b{border:1.5px solid var(--flag);border-radius:50%;color:var(--flag)}
.mk.e{border:1.5px solid var(--flag);border-radius:50%;color:var(--flag);outline:1.5px solid var(--flag);outline-offset:2px}
.mk.bo{border:1.5px solid var(--ink)}
.mk.db{border:1.5px solid var(--ink);outline:1.5px solid var(--ink);outline-offset:2px}
.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.totals>div{background:var(--surface);padding:10px 12px}
/* compact scorecard grid */
.grid{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.grid table{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px;min-width:100%}
.grid th,.grid td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px 4px;text-align:center;min-width:30px}
.grid th:first-child,.grid td:first-child{text-align:left;padding-left:8px;min-width:70px;font-weight:600;position:sticky;left:0;background:var(--surface)}
.grid tr.par td{color:var(--muted)}
.grid td.sum{font-weight:700;background:var(--sunk)}
/* forms + sheet */
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--muted);min-width:0}
input,select,textarea{font:15px var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
textarea{min-height:90px;resize:vertical}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.htable{overflow-x:auto}
.htable table{border-collapse:collapse;width:100%}
.htable th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:4px}
.htable td{padding:3px 4px}
.htable td:first-child{font-family:var(--display);font-weight:700;font-size:18px;width:32px;text-align:center}
.htable input{padding:6px 7px}
.htable input.n{width:62px}
#sheet{position:fixed;inset:0;z-index:20;background:rgb(0 0 0/.45);display:flex;align-items:flex-end;justify-content:center}
#sheet .panel{background:var(--bg);width:100%;max-width:720px;max-height:92%;overflow:auto;border-radius:14px 14px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:760px){#sheet{align-items:center}#sheet .panel{border-radius:14px}}
.sheethead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{background:none;border:0;font-size:26px;color:var(--muted);cursor:pointer;line-height:1;padding:4px 8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.pcheck{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.pcheck input[type=checkbox]{width:20px;height:20px;flex:none}
.pcheck .grow{flex:1;min-width:0}
.pcheck input.n{width:80px}
.preview{display:flex;flex-wrap:wrap;gap:4px}
.preview span{min-width:34px;text-align:center;border:1px solid var(--line);border-radius:6px;padding:4px 2px;font-variant-numeric:tabular-nums;background:var(--surface)}
.preview span i{display:block;font-style:normal;font-size:10px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){#sheet .panel{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>

<header class="top"><div class="wrap"><div class="brand">B10<small>Golf</small></div><div class="status" id="status"></div></div></header>
<main><div class="wrap" id="app"></div></main>
<nav class="tabs"><div class="wrap">
  <button data-tab="turniere">Turniere</button>
  <button data-tab="spieler">Spieler</button>
  <button data-tab="plaetze">Plätze</button>
</div></nav>
<div id="sheet" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ============ Helpers ============ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-5);
const sum = (a) => a.reduce((x, y) => x + (Number(y) || 0), 0);
const num = (v, d) => { const n = parseFloat(String(v ?? '').replace(',', '.')); return Number.isFinite(n) ? n : d; };
const clone = (o) => (o == null ? o : JSON.parse(JSON.stringify(o)));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const fmtPar = (v) => (v == null ? '–' : v === 0 ? 'E' : v > 0 ? '+' + v : String(v));
const fmtDate = (d) => { if (!d) return ''; const x = new Date(d + 'T12:00:00'); return isNaN(x) ? d : x.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' }); };
const fmtHcp = (v) => (v == null || v === '' ? '–' : (v < 0 ? '+' + String(-v).replace('.', ',') : String(v).replace('.', ',')));
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 3200); }

/* ============ Daten ============ */
// Sammlungen: players, courses, tournaments, scores (eine Scorekarte pro Turnier/Runde/Spieler)
const COLS = ['players', 'courses', 'tournaments', 'scores'];
const S = { players: {}, courses: {}, tournaments: {}, scores: {}, loaded: {}, mode: 'connecting', readOnly: false, me: null, slow: false, error: null };
const pending = { players: {}, courses: {}, tournaments: {}, scores: {} };
let db = null, userApi = null, sampleApi = null, canImages = false;
const ui = Object.assign({ tab: 'turniere', view: 'list', tId: null, lb: 'netto', scope: 'all', roundId: null, playerId: null }, store.get('b10-ui', {}));
const saveUi = () => store.set('b10-ui', { tab: ui.tab, view: ui.view, tId: ui.tId, lb: ui.lb, scope: ui.scope, roundId: ui.roundId, playerId: ui.playerId });

let rq = false;
function scheduleRender() { if (rq) return; rq = true; requestAnimationFrame(() => { rq = false; render(); }); }

async function boot() {
  render();
  const c = window.claude;
  if (!c || typeof c.use !== 'function') return startLocal();
  const timer = setTimeout(() => { S.slow = true; render(); }, 10000);
  db = await c.use('db').catch(() => null);
  if (!db) { clearTimeout(timer); return startLocal(); }
  S.mode = 'shared';
  c.use('user').then(async (u) => {
    userApi = u; if (!u) return;
    try { S.me = await u.id(); } catch {}
    try { if ((await u.can('data.write')) === false) S.readOnly = true; } catch {}
    render();
  }).catch(() => {});
  c.use('sample').then(async (s) => {
    sampleApi = s;
    if (s) { try { canImages = !!(await s.limits()).images; } catch { canImages = false; } }
    render();
  }).catch(() => {});
  COLS.forEach((col) => {
    db.collection(col).onSnapshot((snap) => {
      const m = {};
      snap.docs.forEach((d) => { m[d.id] = d.data(); });
      Object.assign(m, pending[col]);
      S[col] = m; S.loaded[col] = true;
      if (!snap.metadata.fromCache && COLS.every((k) => S.loaded[k])) { clearTimeout(timer); S.slow = false; }
      scheduleRender();
    }, (e) => { clearTimeout(timer); S.error = e.code; S.loaded[col] = true; render(); });
  });
}
function startLocal() {
  S.mode = 'local';
  const d = store.get('b10-golf-data', {}) || {};
  COLS.forEach((c) => { S[c] = d[c] || {}; S.loaded[c] = true; });
  render();
}
const persistLocal = () => store.set('b10-golf-data', { players: S.players, courses: S.courses, tournaments: S.tournaments, scores: S.scores });

const chains = {};
function onWriteError(e) {
  const code = e && e.code;
  if (code === 'invalid_argument') { S.readOnly = true; toast('Nur Leserechte: Bitte den Besitzer, dich als Mitwirkende/n einzuladen.'); }
  else if (code === 'quota_exceeded') toast('Speicher voll – bitte alte Turniere löschen.');
  else toast('Speichern fehlgeschlagen – bitte erneut versuchen.');
  render();
}
function save(col, id, data) {
  if (S.readOnly) { toast('Nur Leserechte – Änderung nicht gespeichert.'); return Promise.resolve(); }
  const doc = { ...clone(data), id, updatedAt: Date.now() };
  if (S.me) doc.updatedBy = S.me;
  S[col] = { ...S[col], [id]: doc };
  if (S.mode !== 'shared') { persistLocal(); scheduleRender(); return Promise.resolve(); }
  pending[col][id] = doc;
  const key = col + '/' + id;
  const p = (chains[key] || Promise.resolve())
    .then(() => db.collection(col).doc(id).set(doc))
    .catch(onWriteError)
    .finally(() => { if (pending[col][id] === doc) delete pending[col][id]; });
  chains[key] = p; scheduleRender();
  return p;
}
function removeDoc(col, id) {
  const m = { ...S[col] }; delete m[id]; S[col] = m; delete pending[col][id];
  if (S.mode !== 'shared') { persistLocal(); scheduleRender(); return Promise.resolve(); }
  const key = col + '/' + id;
  const p = (chains[key] || Promise.resolve()).then(() => db.collection(col).doc(id).delete()).catch(onWriteError);
  chains[key] = p; scheduleRender(); return p;
}

/* ============ Golf-Rechnung (WHS) ============ */
const skey = (tid, rid, pid) => `${tid}__${rid}__${pid}`;
const teeOf = (course, name) => (course.tees || []).find((t) => t.name === name) || (course.tees || [])[0] || {};
const coursePar = (course) => sum((course.holes || []).map((h) => h.par));
// Course Handicap = HI × Slope/113 + (CR − Par); bei 9 Löchern mit halbem Index
function courseHcp(hi, course, tee, sex) {
  const n = (course.holes || []).length || 18;
  const w = sex === 'w';
  const cr = num(w && tee.crW ? tee.crW : tee.crM, null);
  const slope = num(w && tee.slopeW ? tee.slopeW : tee.slopeM, null);
  const h = n === 9 ? hi / 2 : hi;
  if (cr == null || slope == null) return Math.round(h);
  return Math.round(h * slope / 113 + (cr - coursePar(course)));
}
// Vorgabeschläge je Loch nach Handicap-Reihenfolge (SI)
function strokeAlloc(ph, holes) {
  const n = holes.length; if (!n) return [];
  const order = holes.map((h, i) => ({ i, si: num(h.si, 99) })).sort((a, b) => a.si - b.si || a.i - b.i);
  const rank = []; order.forEach((o, r) => (rank[o.i] = r + 1));
  const p = Math.abs(ph), base = Math.floor(p / n), rem = p % n;
  return holes.map((_, i) => (ph >= 0 ? base + (rank[i] <= rem ? 1 : 0) : -(base + (rank[i] > n - rem ? 1 : 0))));
}
function playerHi(t, pid) { const p = S.players[pid] || {}; const o = t.hcp && t.hcp[pid]; return num(o, num(p.hcp, 54)); }
function roundResult(t, r, pid) {
  const course = S.courses[r.courseId]; if (!course) return null;
  const holes = course.holes || []; const n = holes.length;
  const tee = teeOf(course, r.tee); const p = S.players[pid] || {};
  const hi = playerHi(t, pid);
  const ch = courseHcp(hi, course, tee, p.sex);
  const ph = Math.round(ch * num(t.allowance, 100) / 100);
  const recv = strokeAlloc(ph, holes);
  const st = (S.scores[skey(t.id, r.id, pid)] || {}).strokes || [];
  const o = { n, hi, ch, ph, recv, played: 0, gross: 0, net: 0, par: 0, sfG: 0, sfN: 0, g: [] };
  holes.forEach((h, i) => {
    let g = st[i]; const par = num(h.par, 4);
    if (!(g > 0)) { o.g.push(null); return; }
    if (t.maxScore === 'ndb') g = Math.min(g, par + 2 + recv[i]);
    o.played++; o.gross += g; o.net += g - recv[i]; o.par += par;
    o.sfG += Math.max(0, 2 + par - g); o.sfN += Math.max(0, 2 + par + recv[i] - g);
    o.g.push(g);
  });
  o.toParG = o.gross - o.par; o.toParN = o.net - o.par; o.complete = n > 0 && o.played === n;
  return o;
}
function leaderboard(t, scope, mode) {
  const sf = t.format === 'stableford';
  const rounds = (t.rounds || []).filter((r) => scope === 'all' || r.id === scope);
  const metricOf = (res) => (!res || !res.played ? null : sf ? (mode === 'brutto' ? res.sfG : res.sfN) : (mode === 'brutto' ? res.toParG : res.toParN));
  const better = (a, b) => (sf ? b - a : a - b);
  const rows = (t.playerIds || []).filter((pid) => S.players[pid]).map((pid) => {
    const per = rounds.map((r) => ({ r, res: roundResult(t, r, pid), dropped: false }));
    let counted = per.filter((x) => metricOf(x.res) != null);
    const best = num(t.countBest, 0);
    if (scope === 'all' && best > 0 && counted.length > best) {
      const sorted = [...counted].sort((a, b) => better(metricOf(a.res), metricOf(b.res)));
      const keep = new Set(sorted.slice(0, best));
      counted.forEach((x) => (x.dropped = !keep.has(x)));
      counted = sorted.slice(0, best);
    }
    return {
      pid, per,
      metric: counted.length ? sum(counted.map((x) => metricOf(x.res))) : null,
      strokes: sum(counted.map((x) => (mode === 'brutto' ? x.res.gross : x.res.net))),
      played: sum(per.map((x) => (x.res ? x.res.played : 0))),
      total: sum(per.map((x) => (x.res ? x.res.n : 0))),
    };
  });
  rows.sort((a, b) => (a.metric == null) - (b.metric == null) || (a.metric != null && better(a.metric, b.metric)) || b.played - a.played || (S.players[a.pid].name || '').localeCompare(S.players[b.pid].name || ''));
  rows.forEach((r, i) => { r.pos = r.metric == null ? '–' : i > 0 && rows[i - 1].metric === r.metric ? rows[i - 1].pos : i + 1; });
  const counts = {}; rows.forEach((r) => (counts[r.pos] = (counts[r.pos] || 0) + 1));
  rows.forEach((r) => (r.posLabel = r.pos === '–' ? '–' : (counts[r.pos] > 1 ? 'T' : '') + r.pos));
  return { rows, rounds, sf, metricOf };
}
function mark(g, par) {
  if (g == null) return '';
  const d = g - par;
  const c = d <= -2 ? 'e' : d === -1 ? 'b' : d === 1 ? 'bo' : d >= 2 ? 'db' : '';
  return `<span class="mk ${c}">${g}</span>`;
}
function tStatus(t) {
  const rs = t.rounds || []; if (!rs.length) return { k: '', l: 'In Planung' };
  let played = 0, total = 0;
  rs.forEach((r) => (t.playerIds || []).forEach((pid) => { const x = roundResult(t, r, pid); if (x) { played += x.played; total += x.n; } }));
  if (total && played === total) return { k: 'done', l: 'Beendet' };
  if (played > 0) return { k: 'live', l: 'Läuft' };
  return { k: '', l: 'Geplant' };
}
const myPlayerId = () => { if (S.me) { const p = Object.values(S.players).find((x) => x.userId === S.me); if (p) return p.id; } return store.get('b10-me', null); };

  h += `<div class="holes">` + holes.map((ho, i) => {
    const g = (sc && sc.strokes || [])[i]; const has = g > 0; const par = num(ho.par, 4); const rv = res.recv[i];
    return `<div class="hole ${i === 8 && holes.length === 18 ? 'turn' : ''}"><div class="hno">${i + 1}</div>
      <div class="hmeta"><b>Par ${par}</b> · HCP ${esc(ho.si ?? '–')}${ho.len ? ` · ${esc(ho.len)} m` : ''} ${rv > 0 ? `<span class="dots" title="${rv} Vorgabeschlag">${'●'.repeat(rv)}</span>` : rv < 0 ? `<span class="dots" title="Plus-Handicap">−${-rv}</span>` : ''}

function holesRows(holes) {

    <td><input class="n" data-h="par" data-i="${i}" inputmode="numeric" value="${esc(h.par ?? '')}" aria-label="Par Loch ${i + 1}"></td>
    <td><input class="n" data-h="si" data-i="${i}" inputmode="numeric" value="${esc(h.si ?? '')}" aria-label="Handicap Loch ${i + 1}"></td>
    <td><input class="n" data-h="len" data-i="${i}" inputmode="numeric" value="${esc(h.len ?? '')}" aria-label="Länge Loch ${i + 1}"></td>
    <td><input data-h="note" data-i="${i}" value="${esc(h.note ?? '')}" placeholder="z. B. Wasser links, Aus rechts" aria-label="Besonderheit Loch ${i + 1}"></td></tr>`).join('');
}
function teeRow(t, i) {

    <td><input class="n" data-t="crM" inputmode="decimal" value="${esc(t.crM || '')}" placeholder="71,2" aria-label="CR Herren"></td>

const defaultHoles = (n) => Array.from({ length: n }, (_, i) => ({ par: 4, si: n === 9 ? i * 2 + 1 : i + 1 }));
function courseSheet(id) {

    <form id="cf" class="stack">
      ${sampleApi ? `<div class="note row" style="justify-content:space-between"><span>Scorecard als Foto/Screenshot (z. B. aus Hole19) oder Text auslesen lassen.</span><span class="row"><label class="btn" ${canImages ? '' : 'hidden'}>Foto wählen<input type="file" id="c_img" accept="image/*" hidden></label><button type="button" class="btn" id="c_txt">Text einfügen</button></span></div><div id="c_ai" class="small muted" hidden></div><textarea id="c_paste" hidden placeholder="Scorecard-Text hier einfügen (Par, HCP, CR/Slope …)"></textarea>` : ''}

      <label class="f">Besonderheiten & Platzregeln<textarea id="c_notes" placeholder="z. B. Besserlegen erlaubt, Drop-Zone an Loch 7, Buggy-Pflicht, Wintergrüns …">${esc(c.notes || '')}</textarea></label>

Antworte NUR mit JSON in genau dieser Form:
{"name": string|null, "location": string|null, "holes": [{"par": number, "si": number|null, "len": number|null}], "tees": [{"name": string, "crM": number|null, "slopeM": number|null, "crW": number|null, "slopeW": number|null}]}

      };

      const tees = readTees(); if (!tees.length) tees.push({ name: 'Standard' });

    };
  });
}

/* Hole19 / manueller Import einer Runde */
function parseNumbers(text, n) {
  const t = text.trim();
  if (/^\d+$/.test(t) && t.length === n) return t.split('').map(Number);
  const nums = (t.match(/\d+/g) || []).map(Number).filter((x) => x >= 1 && x <= 20);
  if (nums.length === n) return nums;
  return null;
}
function importSheet() {
  const t = S.tournaments[ui.tId]; const r = (t.rounds || []).find((x) => x.id === ui.roundId); const c = S.courses[r.courseId]; const p = S.players[ui.playerId];
  const holes = c.holes; const n = holes.length; let result = null;
  openSheet('Runde übernehmen', `
    <div class="small muted">${esc(p.name)} · ${esc(c.name)} · ${n} Löcher. Hole19 hat keine offene Schnittstelle – übernimm die Runde per Screenshot der Hole19-Scorekarte, per kopiertem Text oder tippe die Schläge als Zahlenreihe ein.</div>
    ${sampleApi && canImages ? `<label class="btn primary" style="align-self:flex-start">Hole19-Screenshot wählen<input type="file" id="i_img" accept="image/*" hidden></label>` : ''}
    <label class="f">Zahlen oder Text aus Hole19<textarea id="i_txt" placeholder="z. B. 5 4 6 3 5 4 4 6 5  4 5 3 5 6 4 4 5 5"></textarea></label>
    <div class="row"><button class="btn" id="i_parse">Zahlen übernehmen</button>${sampleApi ? '<button class="btn" id="i_ai">Text mit Claude auslesen</button>' : ''}</div>
    <div id="i_msg" class="small muted"></div>
    <div id="i_prev" class="preview"></div>
    <div class="row" style="justify-content:flex-end"><button class="btn" data-close>Abbrechen</button><button class="btn primary" id="i_ok" disabled>In Scorekarte übernehmen</button></div>`, (panel) => {
    const msg = $('#i_msg', panel), prev = $('#i_prev', panel), ok = $('#i_ok', panel);
    const show = (arr, src) => {
      result = { strokes: holes.map((_, i) => (arr[i] > 0 ? Math.round(arr[i]) : null)), src };
      prev.innerHTML = result.strokes.map((g, i) => `<span><i>${i + 1}</i>${g ?? '–'}</span>`).join('');
      const got = result.strokes.filter((x) => x).length;
      msg.textContent = `${got} von ${n} Löchern erkannt, Summe ${sum(result.strokes)}. Bitte prüfen.`; ok.disabled = !got;
    };
    $('#i_parse', panel).onclick = () => { const arr = parseNumbers($('#i_txt', panel).value, n); if (arr) show(arr, 'manual'); else msg.textContent = `Ich brauche genau ${n} Zahlen (z. B. durch Leerzeichen getrennt)${sampleApi ? ' – oder lass Claude den Text auslesen.' : '.'}`; };
    const ask = async (text, images) => {
      msg.textContent = 'Claude liest die Scorekarte… (einige Sekunden)'; ok.disabled = true;
      try {
        const prompt = `Das ist eine Golf-Scorekarte${images ? ' (Screenshot)' : ' (Text)'} aus der App Hole19 oder einer ähnlichen App. Gesucht sind die Schläge pro Loch für den Spieler "${p.name}"${p.hole19 ? ` (in Hole19: "${p.hole19}")` : ''}. Der Platz "${c.name}" hat ${n} Löcher mit Par ${holes.map((h) => h.par).join(',')}.
Ignoriere Zeilen für Par, HCP/Stroke Index, Meter, Putts, Punkte und Summen (Out/In/Total). Steht nur ein Spieler auf der Karte, nimm diesen.
Antworte NUR mit JSON: {"strokes": [${n} Zahlen oder null für nicht gespielte Löcher], "player": string|null, "date": string|null}${text ? '\n\nText:\n' + text.slice(0, 12000) : ''}`;
        const data = await sampleApi.json(prompt, images ? { images } : {});
        if (!data || !Array.isArray(data.strokes)) throw { code: 'invalid_json' };
        show(data.strokes.map((x) => num(x, null)), 'hole19');

      } catch (e) { msg.textContent = e && e.code === 'not_granted' ? 'Claude ist für diese Seite nicht erlaubt – bitte Zahlen eintippen.' : e && e.code === 'image_rejected' ? 'Das Bild konnte nicht gelesen werden.' : 'Auslesen hat nicht geklappt – bitte erneut versuchen oder Zahlen eintippen.'; }
    };
    const img = $('#i_img', panel); if (img) img.onchange = () => img.files[0] && ask('', [img.files[0]]);
    const aiB = $('#i_ai', panel); if (aiB) aiB.onclick = () => { const v = $('#i_txt', panel).value.trim(); if (v) ask(v); else msg.textContent = 'Bitte zuerst Text einfügen.'; };
    ok.onclick = () => {
      if (!result) return;
      const key = skey(t.id, r.id, p.id);
      save('scores', key, { tournamentId: t.id, roundId: r.id, playerId: p.id, strokes: result.strokes, source: result.src });
      closeSheet(); toast('Runde übernommen');
    };
  });
}

function scorecardSheet(pid) {
  const t = S.tournaments[ui.tId]; const p = S.players[pid];
  const rounds = (t.rounds || []).filter((r) => ui.scope === 'all' || r.id === ui.scope);
  let body = '';
  rounds.forEach((r) => {
    const c = S.courses[r.courseId]; if (!c) return;
    const res = roundResult(t, r, pid); const holes = c.holes || [];
    const idx = (t.rounds || []).indexOf(r) + 1;
    const head = holes.map((_, i) => `<th>${i + 1}</th>`).join('');
    body += `<div class="stack" style="gap:6px"><div class="spread"><h3>R${idx} · ${esc(c.name)}</h3><span class="small muted">${fmtDate(r.date)} · Vorgabe ${res.ph}</span></div>
      <div class="grid"><table><thead><tr><th>Loch</th>${head}<th>Σ</th></tr></thead><tbody>
      <tr class="par"><td>Par</td>${holes.map((h) => `<td>${h.par}</td>`).join('')}<td class="sum">${coursePar(c)}</td></tr>
      <tr class="par"><td>Vorgabe</td>${res.recv.map((v) => `<td>${v ? (v > 0 ? '●'.repeat(v) : v) : ''}</td>`).join('')}<td class="sum">${res.ph}</td></tr>
      <tr><td>Brutto</td>${res.g.map((g, i) => `<td>${mark(g, num(holes[i].par, 4))}</td>`).join('')}<td class="sum">${res.played ? res.gross : '–'}</td></tr>
      <tr><td>Netto</td>${res.g.map((g, i) => `<td>${g == null ? '' : g - res.recv[i]}</td>`).join('')}<td class="sum">${res.played ? res.net : '–'}</td></tr>
      <tr><td>Pkt br./net.</td>${res.g.map((g, i) => `<td class="small">${g == null ? '' : Math.max(0, 2 + num(holes[i].par, 4) - g) + '/' + Math.max(0, 2 + num(holes[i].par, 4) + res.recv[i] - g)}</td>`).join('')}<td class="sum">${res.played ? res.sfG + '/' + res.sfN : '–'}</td></tr>
      </tbody></table></div></div>`;
  });
  openSheet(p.name, body + `<div class="small muted">Kreis = Birdie, Doppelkreis = Eagle oder besser, Quadrat = Bogey, Doppelquadrat = Doppelbogey oder schlechter.</div>
    <div class="row" style="justify-content:flex-end"><button class="btn primary" id="sc_edit">Scores bearbeiten</button></div>`, (panel) => {
    $('#sc_edit', panel).onclick = () => { closeSheet(); ui.playerId = pid; if (ui.scope !== 'all') ui.roundId = ui.scope; ui.view = 'card'; saveUi(); render(); scrollTo(0, 0); };
  });
}

/* Schläge setzen (mit Verzögerung gespeichert) */
const scoreTimers = {};
function setStroke(i, fn) {
  if (S.readOnly) return;
  const t = S.tournaments[ui.tId]; const r = (t.rounds || []).find((x) => x.id === ui.roundId); const c = S.courses[r.courseId];
  const key = skey(t.id, r.id, ui.playerId);
  const sc = clone(S.scores[key]) || { tournamentId: t.id, roundId: r.id, playerId: ui.playerId, strokes: [] };
  sc.strokes = Array.from({ length: c.holes.length }, (_, k) => (sc.strokes || [])[k] ?? null);
  const v = fn(sc.strokes[i], num(c.holes[i].par, 4));
  sc.strokes[i] = v == null || v < 1 ? null : Math.min(v, 20);
  sc.source = 'manual'; sc.updatedAt = Date.now();
  S.scores = { ...S.scores, [key]: sc };
  if (S.mode === 'shared') pending.scores[key] = sc;
  render();
  clearTimeout(scoreTimers[key]);
  scoreTimers[key] = setTimeout(() => save('scores', key, S.scores[key]), 600);
}

/* ============ Events ============ */
document.addEventListener('click', (e) => {
  const tb = e.target.closest('nav.tabs button');
  if (tb) { ui.tab = tb.dataset.tab; if (ui.tab === 'turniere' && ui.view === 'card') ui.view = 'detail'; saveUi(); render(); scrollTo(0, 0); return; }
  const el = e.target.closest('[data-a]'); if (!el || el.closest('#sheet')) return;
  const a = el.dataset.a, id = el.dataset.id;
  switch (a) {
    case 'newT': if (S.readOnly) return toast('Nur Leserechte'); tournamentSheet(null); break;
    case 'openT': ui.tId = id; ui.view = 'detail'; ui.tab = 'turniere'; saveUi(); render(); scrollTo(0, 0); break;
    case 'back': ui.view = 'list'; saveUi(); render(); break;
    case 'editT': tournamentSheet(ui.tId); break;
    case 'lb': ui.lb = el.dataset.v; saveUi(); render(); break;
    case 'scope': ui.scope = el.dataset.v; saveUi(); render(); break;
    case 'enter': ui.view = 'card'; if (ui.scope !== 'all') ui.roundId = ui.scope; saveUi(); render(); scrollTo(0, 0); break;
    case 'enterRound': ui.roundId = id; ui.view = 'card'; saveUi(); render(); scrollTo(0, 0); break;
    case 'pickRound': ui.roundId = id; saveUi(); render(); break;
    case 'pickPlayer': ui.playerId = id; saveUi(); render(); break;
    case 'showCard': scorecardSheet(id); break;
    case 'tapv': setStroke(+el.dataset.i, (g, par) => (g > 0 ? g : par)); break;
    case 'inc': setStroke(+el.dataset.i, (g, par) => (g > 0 ? g + 1 : par)); break;
    case 'dec': setStroke(+el.dataset.i, (g, par) => (g > 0 ? g - 1 : par - 1)); break;
    case 'import': importSheet(); break;
    case 'newP': if (S.readOnly) return toast('Nur Leserechte'); playerSheet(null); break;
    case 'editP': playerSheet(id); break;
    case 'newC': if (S.readOnly) return toast('Nur Leserechte'); courseSheet(null); break;
    case 'editC': courseSheet(id); break;
  }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });

boot();
</script>
